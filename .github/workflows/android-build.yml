name: Android APK (WIP)

# Two ways to trigger a build:
#   1. Manually: GitHub -> Actions -> "Android APK (WIP)" -> Run workflow
#   2. By pushing a tag like v0.0.1-wip:  git tag v0.0.1-wip && git push origin v0.0.1-wip
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to publish the (pre)release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # derive the APK name from the app version in Info.tsx + the short git hash
      # (same hash vite injects into the app, so filename == in-app version)
      - name: Compute version and APK name
        run: |
          HASH=$(git rev-parse --short HEAD)
          APP_VERSION=$(grep -oP 'App Version:\s*\K[0-9]+(\.[0-9]+)+' src/pages/Info.tsx | head -1)
          APP_VERSION=${APP_VERSION:-0.0}
          echo "GIT_HASH=${HASH}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "APK_NAME=Meshcom-${APP_VERSION}-DL9SAU-g${HASH}.apk" >> "$GITHUB_ENV"

      # no `cache: npm` here: we don't commit a package-lock.json (fresh Cap-8
      # resolve each build), and setup-node's npm cache requires a lock file.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install (not ci) so a lockfile that predates the deps still resolves.
      # --legacy-peer-deps: tolerate peer-dep mismatches during the Capacitor 7->8
      # migration (e.g. @capacitor/assets), so install doesn't hard-fail.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # runs "tsc && vite build" -> also type-checks the whole project
      - name: Build web app
        run: npm run build

      # Capacitor 7 requires JDK 21
      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # android/ is not committed, so create the native project on the fly
      - name: Add & sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      # replace the default Capacitor icon with the real MeshCom icon
      # (@capacitor/assets reads assets/icon.png + splash*.png)
      - name: Generate app icons & splash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick fonts-dejavu-core
          mkdir -p assets
          cp resources/icon.png assets/icon.png
          cp resources/splash.png assets/splash.png
          cp resources/splash-dark.png assets/splash-dark.png
          # overlay a "DL9SAU" fork badge (bottom band) on the icon so the fork is
          # visible even when the launcher truncates the app name. Keep the plain
          # icon if the overlay fails, so the build never breaks over branding.
          W=$(identify -format '%w' assets/icon.png)
          BAND=$(( W * 22 / 100 ))
          PS=$(( W * 150 / 1024 ))
          OFF=$(( W * 38 / 1024 ))
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          if convert assets/icon.png \
               \( -size ${W}x${BAND} xc:'rgba(0,0,0,0.55)' \) -gravity South -composite \
               -gravity South -font "$FONT" -fill white -pointsize ${PS} -annotate +0+${OFF} 'DL9SAU' \
               assets/icon_badged.png; then
            mv assets/icon_badged.png assets/icon.png
            echo "DL9SAU badge applied"
          else
            echo "badge step failed - using plain icon"
          fi
          # overlay "DL9SAU fork" below the logo on both splash images (white bg,
          # so red text); keep the plain splash if it fails
          for SPL in assets/splash.png assets/splash-dark.png; do
            if convert "$SPL" -gravity South -font "$FONT" -fill '#a01f2d' \
                 -pointsize 120 -annotate +0+150 'DL9SAU fork' "${SPL}.tmp.png"; then
              mv "${SPL}.tmp.png" "$SPL"
              echo "splash badge applied: $SPL"
            else
              echo "splash badge failed - using plain splash: $SPL"
            fi
          done
          npx capacitor-assets generate --android
          # notification small icon: Android renders it as a monochrome silhouette,
          # so make a white version of the logo on transparent (white bg -> clear,
          # logo -> white). Referenced as smallIcon 'ic_stat_notify' in the app.
          mkdir -p android/app/src/main/res/drawable
          convert assets/icon.png -fuzz 30% -transparent white \
               -channel RGB -evaluate set 100% +channel -resize 96x96 \
               android/app/src/main/res/drawable/ic_stat_notify.png \
            && echo "notification icon generated" \
            || echo "notification icon generation failed - falls back to default"

      # sign every build with the committed debug keystore so signatures are
      # identical and a new build installs over the previous one (keeps DB + BLE
      # PIN). The ~/.android/debug.keystore default location is unreliable with
      # Capacitor/AGP, so wire the signing config EXPLICITLY into build.gradle.
      # (A second `android {}` block just merges into the existing one.)
      - name: Configure explicit debug signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../ci/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE
          echo "----- appended signing config -----"
          tail -n 20 android/app/build.gradle

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ env.APK_NAME }}"

      # available on the Actions run even if the release step is skipped
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      # WIP builds publish to ONE rolling release at a fixed tag (wip-latest).
      # GitHub sorts the Releases *list* by tag name, not recency, so per-hash
      # tags (wip-g<hash>) landed in random order and users grabbed an older
      # build. With a single release there is nothing to mis-sort - it's always
      # the newest, at a stable link (/releases/tag/wip-latest). The git hash
      # stays in the APK name + release title for verification. Delete the old
      # one first (incl. its tag) so only the newest APK remains. Real version
      # tags (v*) keep their own separate release.
      - name: Remove previous WIP release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete wip-latest --yes --cleanup-tag || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'wip-latest' }}
          target_commitish: ${{ github.sha }}
          name: Meshcom ${{ env.APP_VERSION }}-DL9SAU WIP (g${{ env.GIT_HASH }})
          files: ${{ env.APK_NAME }}
          body: |
            Work-in-progress build — debug APK (debug-signed, installable via "unknown sources").
            Rolling release — always the newest WIP build. Version below / in the APK name.
            Version: ${{ env.APP_VERSION }}-DL9SAU-g${{ env.GIT_HASH }}
            Branch: `${{ github.ref_name }}`
            Commit: ${{ github.sha }}

  # iOS compile-check (portability only — unsigned simulator build, no IPA). Runs
  # alongside the Android job. Once iOS is confirmed green, comment this whole job
  # out again to save macOS runner minutes; re-enable later (e.g. after the
  # foreground-service native changes) to catch iOS breakage / wrong #ifdefs.
  ios-compile:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # runs "tsc && vite build" -> also type-checks the whole project
      - name: Build web app
        run: npm run build

      # a stale ios/ IS committed (Cap 7); drop it and regenerate a fresh Cap-8
      # project (like the android job does). Removal is only in the runner checkout.
      - name: Add & sync iOS platform
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          # CocoaPods creates the .xcworkspace; run it explicitly if there's a Podfile
          if [ -f ios/App/Podfile ]; then (cd ios/App && pod install); fi
          ls -la ios/App

      # compile-only for the simulator, signing disabled (no Apple account needed).
      # use the workspace if CocoaPods produced one, else the plain project (SPM).
      - name: Compile iOS (simulator, unsigned)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            TARGET="-workspace ios/App/App.xcworkspace"
          else
            TARGET="-project ios/App/App.xcodeproj"
          fi
          echo "Building with: $TARGET"
          xcodebuild $TARGET \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
